---
name: Check Code

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0"  # Sunday 05:00 UTC, audit alert
  push:
    branches: ["main", "renovate/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1  # latest only

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Run prek pre-commit
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        with:
          extra-args: '--all-files --quiet'


      - name: Run prek pre-commit
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        with:
          extra-args: '--all-files --quiet'

      - name: Run CSpell
        uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58  # v9.1.0
        with:
          files: '**/*'
          incremental_files_only: false

      - name: Prepare
        run: |
          uv sync --frozen --no-build

      - name: Run py lint Ruff
        run: |
          uv run --frozen --no-build ruff format --check
          uv run --frozen --no-build ruff check --no-fix --output-format=github

      - name: Run py type check Pyright
        run: uv run --frozen --no-build pyright

      - name: Run py test Pytest
        run: |
          uv run --frozen --no-build pytest
        #     --cov \
        #     --cov-report=xml:coverage.xml \
        #     --quiet \
        #     --tb=short

      - name: Run py dead code Vulture
        run: uv run --frozen --no-build vulture

      # for SonarQube coverage report
      # - uses: SonarSource/sonarqube-scan-action@v8
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run py audit
        run: uv audit --preview-features audit
