name: Check Code

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1 # latest only

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run prek pre-commit
        uses: j178/prek-action@v3.0.0

      - name: Run markdownlint
        run: npm exec -- markdownlint-cli2 "**/*.md"

      - name: Run cspell
        run: npm exec -- cspell-cli --gitignore --unique --silent .

      - name: Prepare
        run: |
          uv sync --frozen --no-build

      - name: Run py format Ruff
        run: |
          uv run --frozen --no-build ruff format --check
          uv run --frozen --no-build ruff check --no-fix --output-format=github

      - name: Run py test Pytest
        run: |
          uv run --frozen --no-build pytest \
            --cov \
            --cov-report=xml:coverage.xml \
            --quiet \
            --tb=short

      - name: Run py dead code Vulture
        run: uv run --frozen --no-build vulture

      - name: Run py audit
        run: uv audit --preview-features audit
