name: Check Code

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1 # latest only

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run prek pre-commit
        uses: j178/prek-action@v3.0.0

      - name: Prepare
        run: |
          uv sync --frozen --no-build

      - name: Run md lint
        run: npm exec -- markdownlint-cli2 "**/*.md"

      - name: Run CSpell
        run: npm exec -- cspell-cli --gitignore --unique .

      - name: Run py lint Ruff
        run: |
          uv run --frozen --no-build ruff format --check
          uv run --frozen --no-build ruff check --no-fix --output-format=github

      - name: Run py type check Pyright
        run: uv run --frozen --no-build pyright src

      - name: Run py test Pytest
        run: |
          uv run --frozen --no-build pytest
        #     --cov \
        #     --cov-report=xml:coverage.xml \
        #     --quiet \
        #     --tb=short

      - name: Run py dead code Vulture
        run: uv run --frozen --no-build vulture

      # for SonarQube coverage report
      # - uses: SonarSource/sonarqube-scan-action@v8
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run py audit
        run: uv audit --preview-features audit
