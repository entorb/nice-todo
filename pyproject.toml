[project]
name = "todo-board"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.18.0",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "vulture>=2.16",
]

[tool.pyright]
include = ["src"]

[tool.vulture]
paths = ["src"]
exclude = ["src/models.py"]
ignore_names = [
    "_auth_middleware",
    "_login_submit",
    "_logout",
    "board_page",
    "date_created",
    "last_login",
    "login_page",
    "text",
]
